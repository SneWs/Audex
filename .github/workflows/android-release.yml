name: Android APK

on:
  push:
    branches:
      - master
    paths:
      - "Mobile/Android/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (defaults to android-latest)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          sparse-checkout: Mobile/Android

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 16111833
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Prepare release signing
        run: |
          missing=()
          [[ -z "$KEYSTORE_BASE64" ]] && missing+=(ANDROID_KEYSTORE_BASE64)
          [[ -z "$ANDROID_KEYSTORE_PASSWORD" ]] && missing+=(ANDROID_KEYSTORE_PASSWORD)
          [[ -z "$ANDROID_KEY_ALIAS" ]] && missing+=(ANDROID_KEY_ALIAS)
          [[ -z "$ANDROID_KEY_PASSWORD" ]] && missing+=(ANDROID_KEY_PASSWORD)
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required repository secrets: %s\n' "${missing[*]}"
            exit 1
          fi

          keystore_path="$RUNNER_TEMP/signing/audex-release.jks"
          mkdir -p "$(dirname "$keystore_path")"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: Mobile/Android
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Prepare APK artifact
        working-directory: Mobile/Android
        run: |
          apk_path=$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)
          if [[ -z "$apk_path" ]]; then
            echo "APK was not produced"
            exit 1
          fi
          cp "$apk_path" app/build/outputs/apk/release/Audex.apk

      - name: Upload APK to build results
        uses: actions/upload-artifact@v4
        with:
          name: audex-android-apk
          path: Mobile/Android/app/build/outputs/apk/release/Audex.apk
          if-no-files-found: error
          retention-days: 30

      - name: Choose release tag
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "$REQUESTED_TAG" ]]; then
            release_tag="$REQUESTED_TAG"
          else
            release_tag="android-latest"
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Publish latest GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          APK_PATH: Mobile/Android/app/build/outputs/apk/release/Audex.apk
        run: |
          release_title="Audex Android $RELEASE_TAG"
          release_notes="Installable Android APK built from commit $GITHUB_SHA."

          if [[ "$RELEASE_TAG" == "android-latest" ]]; then
            git tag --force "$RELEASE_TAG" "$GITHUB_SHA"
            git push --force origin "refs/tags/$RELEASE_TAG"
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_PATH" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --latest --title "$release_title" --notes "$release_notes" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "$APK_PATH" --latest --target "$GITHUB_SHA" --title "$release_title" --notes "$release_notes" --repo "$GITHUB_REPOSITORY"
          fi
